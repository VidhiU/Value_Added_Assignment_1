<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilli Travel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- navigation bar -->
    <header class="navbar">
        <!--  logo and website name -->
        <div class="logo">
            <img src="../../../Task 3/Assets/04.png" alt="Travel logo">
            <h2>Skilli Travel</h2>
        </div>
        <!-- this contains the navigation links -->
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Destinations</a>
            <a href="#">Packages</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <!-- booking buton -->
        <a href="#" class="book-btn">Book Now</a>
    </header>
    <!-- hero setion -->
    <section class="hero">
        <img src="../../../Task 3/Assets/07.png" alt="destination">
        <div class="hero-content">
            <h1>Explore the World <br> with Skilli Travel</h1>
            <p>Discover amazing destination ,curated travel <br> packages and unforgettable expereinces.</p>
            <!-- hero buttons -->
            <div class="hero-buttons">
                <a href="#" class="explore-btn">Explore Destinations → </a>
                <a href="#" class="learn-btn">Learn More</a>
            </div>
        </div>
    </section>
</body>
</html>
