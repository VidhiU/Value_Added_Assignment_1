<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <!-- connecting css -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- this section contains the portal menu -->
    <div class="sidebar">
        <!-- the logo and title -->
        <div class="sidebar-logo">
            <img src="../../../Task 2/Assets/17.png" alt="logo">
            <h2>Student <br> Portal</h2>
        </div>
        <!--links to navigate -->
        <nav>
            <ul class="sidebar-links">
                <li>
                    <a href="#" class="active">
                        <img src="../../../Task 2/Assets/13.png" alt="">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../../Task 2/Assets/12.png" alt="">
                        Assignments
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../../Task 2/Assets/11.png" alt="">
                        Courses
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../../Task 2/Assets/10.png" alt="">
                        Progress
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../../../Task 2/Assets/09.png" alt="">
                        Profile
                    </a>
                </li>
            </ul>
        </nav>
        <!-- keeping logout separate makes it easier to position at the bottom -->
        <div class="logout">
            <a href="#">
                <img src="../../../Task 2/Assets/08.png" alt="">
                Logout
            </a>
        </div>
    </div>
    <!-- this area holds the dashboard content which will appear below topbar-->
    <div class="main-content">
        <!-- the topbar gives the page its heading and profile area -->
        <div class="topbar">
            <h1>Dashboard</h1>
            <div class="topbar-right">
                <img src="../../../Task 2/Assets/16.png" alt="Notifications">
                <div class="profile">
                    <img src="../../../Task 2/Assets/15.png" alt="Profile picture">
                    <div>
                        <h3>Prathmesh</h3>
                    </div>
                    <!-- dropdown arrow -->
                    <div class="dropdown-arrow"></div>
                </div>
            </div>
        </div>
        <!-- welcome section -->
        <div class="welcome-banner">
            <!-- welcome message -->
            <div class="welcome-text">
                <h2>Welcome Back, Prathmesh! 👋</h2>
                <p>Continue your learning journey and complete your pending assignments.</p>
            </div>
            <!-- welcome illustration -->
            <div class="welcome-image">
                <img src="../../../Task 2/Assets/18.png" alt="Learning illustration">
            </div>
        </div>
        <div class="stats-container">
            <!-- courses card -->
            <div class="stat-card courses-card">
                <img src="../../../Task 2/Assets/04.png" alt="">
                <div>
                    <h3>3</h3>
                    <p>Courses</p>
                </div>
            </div>
            <!-- assignments card -->
            <div class="stat-card assignments-card">
                <img src="../../../Task 2/Assets/03.png" alt="">
                <div>
                    <h3>12</h3>
                    <p>Assignments</p>
                </div>
            </div>
            <!-- progress card -->
            <div class="stat-card progress-card">
                <img src="../../../Task 2/Assets/02.png" alt="">
                <div>
                    <h3>78%</h3>
                    <p>Progress</p>
                </div>
            </div>
            <!-- due this week card -->
            <div class="stat-card due-card">
                <img src="../../../Task 2/Assets/01.png" alt="">
                <div>
                    <h3>5</h3>
                    <p>Due This Week</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
